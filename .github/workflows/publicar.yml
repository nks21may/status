# Publica el status en cada push a main (ADR-0017): primero el gate, y si pasa, el Worker y la imagen
# del emisor. Si el gate falla, no se publica nada.
#
# El Worker lo publica Wrangler con un token de Cloudflare de la cuenta, con Workers Scripts y D1 en
# edición y sin permisos sobre la zona: no puede tocar el DNS. El dominio es un Custom Domain que se
# creó a mano. La imagen del emisor la baja la VPS en su ciclo de deploy: qué corre ahí, y cómo, se
# decide en el repo infra (ADR-0004).

name: publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Dos publicaciones seguidas no se pisan: la segunda espera a la primera.
concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run gate

  worker:
    # Sólo main publica: un workflow_dispatch desde otra rama no puede pisar lo que está en línea.
    if: github.ref == 'refs/heads/main'
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Las migraciones van antes del código que las usa (ADR-0009: una aplicada no se edita).
      - run: npx wrangler d1 migrations apply status --remote

      # Empaqueta la página con el build de wrangler.jsonc y publica el Worker.
      - run: npx wrangler deploy

  imagen:
    if: github.ref == 'refs/heads/main'
    needs: gate
    # Runner arm porque la VPS es arm: la imagen sale nativa, sin QEMU.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # El tag por SHA es el rollback.
          tags: |
            ghcr.io/nks21may/status-emisor:latest
            ghcr.io/nks21may/status-emisor:${{ github.sha }}
          # Ata el package al repo, así hereda sus permisos.
          labels: org.opencontainers.image.source=https://github.com/nks21may/status
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cada push agrega una versión; cinco alcanzan para volver atrás. Si la poda falla, la imagen ya
      # está publicada. La v5 es la última al 2026-11-02 y todavía corre en Node 20: GitHub la fuerza
      # a Node 24 y deja un aviso. Se sube cuando salga una que corra en Node 24.
      - uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: status-emisor
          package-type: container
          min-versions-to-keep: 5
